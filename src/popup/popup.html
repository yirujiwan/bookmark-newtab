<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>书签（新标签打开）</title>
  </head>
  <body>
    <header class="bar">
      <input id="q" type="search" placeholder="搜索书签…" autocomplete="off" spellcheck="false" />
    </header>

    <main id="tree" class="tree" role="tree" aria-label="书签列表">
      <p class="empty" id="loading">正在读取书签…</p>
    </main>

    <footer class="settings">
      <label class="row">
        <input type="checkbox" id="enabled" />
        <span>点书签时在新标签页打开</span>
      </label>
      <label class="row sub">
        <input type="checkbox" id="activateNewTab" />
        <span>新标签立即切到前台</span>
      </label>
      <label class="row sub">
        <input type="checkbox" id="skipPinned" />
        <span>固定标签页不拦截</span>
      </label>
      <p class="hint">
        面板里：单击 = 新标签打开 · 中键或 Ctrl+单击 = 后台打开
      </p>

      <details class="diag">
        <summary>诊断 · 最近的书签点击</summary>
        <div class="diag-list" id="diagList"></div>
      </details>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
